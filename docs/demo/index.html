.demo-account{display:block;font-size:14px;color:#aaa}.feedback-card .demo-feedback-note{font-size:14px;color:#777;margin:-7px 0 24px;padding-bottom:17px;border-bottom:1px solid #e3e3e3}@media(max-width:760px){.sidebar-bottom .account .demo-account{font-size:13px}}

/* Editing actions are visibly underlined in their default state. */
.mm-app .edit-action{color:#292929;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.mm-app .edit-action:hover{color:#111;text-decoration:underline;text-decoration-thickness:2px}
.mm-app .edit-action:active{color:#000}
.mm-app .edit-action:focus-visible{outline:2px solid #333;outline-offset:4px}

/* Text-only actions remain recognizable without pointer hover. */
.mm-app .account a,.mm-app .overview-stats button span,.mm-app .workflow-card>span,.mm-app .recent-quotes>button>span:last-child{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.mm-app .statement-list>button:not(.active) p{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.mm-app .map-statement-card details>summary,.mm-app .snapshot>summary{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
/* Keep the project dropdown chevron comfortably inset from its border. */
.mm-sidebar .project-select{display:block;position:relative;min-width:0}
.mm-sidebar .project-select select{appearance:none;-webkit-appearance:none;padding-right:42px!important}
.mm-sidebar .project-select::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:1.5px solid #eee;border-bottom:1.5px solid #eee;transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* Demo controls share the project header. */
.mm-topbar.demo-topbar{height:auto;min-height:80px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
.mm-topbar.demo-topbar>span{white-space:normal;max-width:100%}
.mm-topbar.demo-topbar>.actions{margin-left:auto;justify-content:flex-end}
@media(max-width:760px){.mm-topbar.demo-topbar{padding-top:14px;padding-bottom:14px;gap:12px}.mm-topbar.demo-topbar>span{flex-basis:100%}}

/* Lightweight, contextual onboarding. */
.learning-start{max-width:900px;padding-top:35px}
.learning-start .page-heading{margin-bottom:28px}
.learning-start .page-heading p{max-width:700px}
.learning-start-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.learning-invitation{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 24px;background:#eee;border:1px solid #d8d8d8;border-radius:8px;margin-bottom:32px}
.learning-invitation p{font-size:16px;line-height:1.5;margin:0;color:#555}
.learning-invitation button{flex-shrink:0}
.mm-app.tour-layer{position:fixed;inset:0;z-index:70;min-height:0;display:block;background:none;pointer-events:none;font-family:Arial,Helvetica,sans-serif;color:#222}
.tour-spotlight{position:absolute;box-sizing:border-box;border:1px solid #b8b8b8;border-radius:10px;box-shadow:0 0 0 9999px #0003;pointer-events:none}
.tour-callout{position:absolute;pointer-events:none}
.tour-popover{position:relative;pointer-events:auto;box-sizing:border-box;padding:24px;border:1px solid #e1e1e1;border-radius:12px;background:#fff;box-shadow:0 8px 24px #00000014;overflow:auto;overscroll-behavior:contain}
.tour-pointer{position:absolute;overflow:visible;pointer-events:none;width:10px;height:20px;fill:#fff;stroke:#e1e1e1;stroke-width:1;stroke-linejoin:round}
.tour-pointer.pointer-left{left:-9px}
.tour-pointer.pointer-right{right:-9px}
.tour-pointer.pointer-top,.tour-pointer.pointer-bottom{width:20px;height:10px}
.tour-pointer.pointer-top{top:-9px}
.tour-pointer.pointer-bottom{bottom:-9px}
.tour-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-6px -6px 18px}
.tour-back-slot{width:36px;height:36px;flex-shrink:0}
.tour-utility-actions{display:flex;align-items:center;gap:2px}
.mm-app .tour-icon-button{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;margin:0;padding:0;border:0;border-radius:7px;background:transparent;color:#555;box-shadow:none;text-decoration:none}
.mm-app .tour-icon-button:hover{background:#efefef;color:#222}
.mm-app .tour-icon-button:active{background:#dedede;color:#111}
.mm-app .tour-popover .tour-icon-button:focus-visible{outline:none;background:#333;color:#fff}
.mm-app .tour-popover h2{font-size:23px;font-weight:500;line-height:1.3;margin:0 0 12px;letter-spacing:-.5px}
.mm-app .tour-popover h2:focus{outline:none}
.mm-app .tour-popover p{font-size:15px;line-height:1.6;color:#555;margin:0}
.tour-actions{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid #e1e1e1}
.tour-actions>.primary{margin-left:auto;min-width:84px;flex-shrink:0}
.mm-app .tour-find{margin-top:16px}
.mm-app .tour-target{scroll-margin:28px}
.tour-popover button:focus-visible{outline:2px solid #333;outline-offset:4px}
.learning-practice-settings h2{font-size:25px;font-weight:500;margin:0 0 18px}
.learning-practice-settings p{font-size:16px;line-height:1.6;margin-bottom:24px}
.mm-sidebar{overflow-y:auto}
@media(max-width:760px){.learning-start{padding-top:10px}.learning-invitation{align-items:flex-start;flex-direction:column;gap:14px}.tour-popover{padding:20px}.tour-toolbar{margin-bottom:14px}.tour-actions{margin-top:20px}}

/* Brief, target-led motion gives each tutorial step a clear arrival. */
.tour-callout{--tour-enter-x:0px;--tour-enter-y:8px}
.tour-callout[data-edge="left"]{--tour-enter-x:-8px;--tour-enter-y:0px}
.tour-callout[data-edge="right"]{--tour-enter-x:8px;--tour-enter-y:0px}
.tour-callout[data-edge="top"]{--tour-enter-y:-8px}
.tour-motion{position:relative}
.tour-layer[data-ready="true"] .tour-motion{animation:tour-arrive .32s cubic-bezier(.22,1,.36,1) both}
.tour-spotlight::after{content:'';position:absolute;inset:-4px;border:1px solid #b8b8b8;border-radius:12px;opacity:0;pointer-events:none}
.tour-layer[data-ready="true"] .tour-spotlight::after{animation:tour-target-pulse .7s ease-out .08s both}
.tour-progress{display:flex;align-items:center;justify-content:flex-start;gap:5px;flex-shrink:0;min-width:58px}
.tour-progress>span{display:block;flex-shrink:0;width:5px;height:5px;border-radius:999px;background:#d5d5d5;transition:width .28s ease,background .28s ease}
.tour-progress>span.complete{background:#888}
.tour-progress>span.current{width:18px;background:#252525}
.mm-app .tour-popover .primary{transition:background .16s,transform .16s,box-shadow .16s}
@media(hover:hover){.mm-app .tour-popover .primary:hover{transform:translateY(-1px);box-shadow:0 3px 7px #0002}}
.mm-app .tour-popover .primary:active{transform:translateY(0);box-shadow:none}
.mm-app .tour-popover .tour-next{position:relative;isolation:isolate;transform-origin:center;transition:background .16s,transform .2s cubic-bezier(.2,.8,.3,1.25),box-shadow .16s}
.mm-app .tour-popover .tour-next:active{transform:translateY(2px) scale(.94);background:#111;box-shadow:none;transition-duration:.07s}
.particle-button{position:relative;transition:transform .14s ease-out}
.particle-button[data-particle-pressed="true"],.mm-app .tour-popover .tour-next[data-particle-pressed="true"]{transform:scale(.95);box-shadow:none}
.particle-burst-layer{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:none}
.particle-burst-dot{position:absolute;display:block;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:#333;pointer-events:none}
.tour-layer[data-ready="true"] .tour-actions[data-advanced="true"] .tour-progress>span.current{animation:tour-progress-pop .4s cubic-bezier(.22,.75,.3,1) both}
@keyframes tour-progress-pop{0%{transform:translateY(1px) scale(.8)}40%{transform:translateY(-3px) scale(1.12)}72%{transform:translateY(.5px) scale(.97)}100%{transform:translateY(0) scale(1)}}
@keyframes tour-arrive{from{opacity:0;transform:translate(var(--tour-enter-x),var(--tour-enter-y))}to{opacity:1;transform:translate(0,0)}}
@keyframes tour-target-pulse{0%{opacity:0;inset:-3px}20%{opacity:.35}100%{opacity:0;inset:-13px}}
@media(prefers-reduced-motion:reduce){.tour-layer[data-ready="true"] .tour-motion,.tour-layer[data-ready="true"] .tour-spotlight::after{animation:none}.tour-progress>span,.mm-app .tour-popover .primary,.particle-button{transition:none}.mm-app .tour-popover .primary:hover,.mm-app .tour-popover .tour-next:active,.particle-button[data-particle-pressed="true"],.mm-app .tour-popover .tour-next[data-particle-pressed="true"]{transform:none}.particle-burst-layer{display:none}}
